      items = data.items.filter(i => i.visible !== false);
    } else throw 0;
  } catch {
    items = DEFAULT_ITEMS;
  }

  const list = document.getElementById('item-list');
  list.innerHTML = items.map(item =>
    `<a href="${item.url}" class="item"${item.ext ? ' target="_blank"' : ''}>

  ).join('');
